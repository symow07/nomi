name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second push to the same branch supersedes the first; the queued run is not
# telling us anything about code that is no longer there.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Typecheck, core purity, and the suites that need no database. Split from the
  # integration job so a compile error is reported in seconds rather than after
  # Postgres has finished starting.
  check:
    name: typecheck · boundaries · unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Read from .nvmrc so this file, package.json's engines, and Railway
          # cannot drift apart. TypeScript 7 is a native compiler that resolves a
          # PER-PLATFORM binary at install time, so `npm ci` must run on the
          # runner — a node_modules built on macOS cannot typecheck on Linux.
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run check      # typecheck + core purity + the full unit suite
      - run: npm run trust      # the 23 scripted trust scenarios

  # The integration suite: everything that needs a real Postgres, and the only
  # place several product invariants can be proved at all. Most of it is
  # boot.test.ts, which builds the REAL production composition against a real
  # database — so RLS, the boot guards, the send path, activation and the owner
  # routes are proved here or nowhere.
  #
  # Deliberately not counted. This comment said "214 tests, 189 of them
  # boot.test.ts" and was wrong within a week; a number in prose is a number
  # nobody updates. `run-integration.mjs` derives the count and asserts none
  # were skipped, which is the part that actually needed guarding.
  integration:
    name: integration (real Postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nomi
        ports: ['5432:5432']
        # Without this the first migration can race the server's own startup.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      MIGRATE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/nomi
      # The RUNTIME connection is a DIFFERENT, non-superuser role. Running these
      # tests as `postgres` would make every RLS assertion pass while proving
      # nothing, because a superuser bypasses row security entirely — which is
      # exactly what M19's runtime-identity guard exists to prevent.
      DATABASE_URL: postgresql://nomi_app:nomi_app@127.0.0.1:5432/nomi

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Apply migrations
        run: node tools/migrate.mjs

      - name: Grant the app role a login
        # Migration 0005 creates the role NOLOGIN under its original name and
        # 0026 renames it to nomi_app; a password is set per environment, out of
        # band. This is that step for CI, after every migration has run.
        run: |
          psql "$MIGRATE_DATABASE_URL" -v ON_ERROR_STOP=1 -c \
            "alter role nomi_app login password 'nomi_app';"

      - name: Confirm the runtime role is subject to RLS
        # Fail here, loudly, rather than let the tenant-isolation suite pass
        # against a connection that ignores every policy it asserts. A superuser
        # makes every RLS assertion green while proving nothing.
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -tAc \
            "select case when rolsuper or rolbypassrls
                         then 'UNSAFE: runtime role bypasses RLS' end
               from pg_roles where rolname = current_user" | grep -q . && exit 1 || true

      - name: Seed the demo and sandbox tenants
        run: |
          npm run seed:demo
          npm run seed:sandbox

      # `vitest run` EXITS 0 WHEN EVERYTHING IS SKIPPED, and every file in
      # tests/integration/ self-skips on a missing DATABASE_URL. Unset or rename
      # that variable and this job went green having run none of it: RLS
      # isolation, the boot guards, the send path, activation, promotion,
      # demotion. run-integration.mjs asserts ZERO skipped — not a minimum
      # count, which would be a transcribed number that drifts.
      - name: Integration suite
        run: node tools/run-integration.mjs

      # Proves the suite is repeatable (M22). It mutates the database it asserts
      # against, so a second pass is the only thing that catches an ordering
      # dependency — and a green-then-red pair used to look like a regression.
      - name: Integration suite, again
        run: node tools/run-integration.mjs
