name: Deploy drift (outside watcher)

# THE OUTSIDE DEPLOY WATCHER (the owner, 2026-10-16). Every hour (its limit is an hour, so more often buys nothing): which commit is production running, and how
# long has main had a merge production lacks? Caught up (or the oldest missing merge under an hour old) pings the
# Healthchecks check; behind pings its /fail. Any failure of this job pings nothing, and Healthchecks alarms when the
# period and grace pass — so Actions not running is an ALARM, not silence. tools/deploy-drift.mjs has the rule;
# docs/DEPLOY-DRIFT.md the setup. Never on pull_request: the Railway token must not reach a branch's code.
on:
  schedule:
    - cron: '7 * * * *'        # hourly, off the top of the hour
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print what it finds and ping nothing'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy-drift
  cancel-in-progress: false

jobs:
  drift:
    name: production against main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            tools/deploy-drift.mjs
            .nvmrc
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Compare and ping
        env:
          RAILWAY_DEPLOY_WATCH_TOKEN: ${{ secrets.RAILWAY_DEPLOY_WATCH_TOKEN }}
          DEPLOY_DRIFT_PING_URL: ${{ secrets.DEPLOY_DRIFT_PING_URL }}
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}
        run: node tools/deploy-drift.mjs $DRY_RUN
